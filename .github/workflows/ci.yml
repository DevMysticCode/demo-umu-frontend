name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first: a leaked secret should halt the pipeline before spending
  # minutes on a build (same pattern as umu-backend's CI).
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
      - name: gitleaks
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  build:
    name: build
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install deps
        run: npm ci --legacy-peer-deps

      - name: build
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: https://demo-umu-backend-production.up.railway.app
