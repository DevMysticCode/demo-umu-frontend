name: ios-testflight

# Builds the iOS app on GitHub's own macOS runner (no local Mac needed)
# and uploads it to TestFlight. Runs on every push to main, plus
# workflow_dispatch so it can be triggered manually to verify the
# pipeline before relying on an actual push.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: "fastlane lane to run (default: testflight)"
        required: false
        default: testflight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # fastlane match pushes the encrypted cert/profile to the ios-certs
  # branch of this same repo using the ephemeral per-run GITHUB_TOKEN -
  # needs write access, which isn't the default.
  contents: write

jobs:
  testflight:
    name: build and upload to TestFlight
    # macos-14 was being allocated as a "macos-14-arm64-us-xl" large
    # runner, which needs a paid plan - macos-latest/macos-15 stays on
    # the standard free-tier runner (deployment team guidance, 2026-11-27).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # git's HTTP transport has no stall timeout by default, so a slow
      # or dropped connection during a Swift Package Manager checkout
      # (xcodebuild shells out to git for this) can hang forever rather
      # than fail - this is what caused run 45974060701 to freeze for
      # 37+ minutes mid-transfer of the capacitor-swift-pm package.
      - name: set a git transfer stall timeout
        run: |
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30

      - uses: actions/setup-node@v4
        with:
          # Capacitor's CLI requires Node >=22 (cap add ios fails on 20
          # with "[fatal] The Capacitor CLI requires NodeJS >=22.0.0").
          node-version: '22'
          cache: 'npm'

      - name: install JS deps
        run: npm ci --legacy-peer-deps

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Capacitor's iOS platform needs CocoaPods (macOS-only), so it's
      # generated here rather than committed - no Mac available to the
      # maintainer to generate/update it locally. Idempotent: skipped
      # once an ios/ folder exists (e.g. if it's committed later).
      - name: add iOS platform if missing
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: generate app icons/splash
        run: npm run mobile:assets

      # CAPACITOR_USE_REMOTE=false (inside mobile:build:bundled:ios) is
      # the part that satisfies Apple's "no thin WebView wrapper"
      # requirement (Guideline 4.2) - the shell loads its own bundled
      # assets instead of pointing at the Vercel deployment. See
      # capacitor.config.ts's own comment block for the full rationale.
      - name: build web app + sync iOS project
        run: npm run mobile:build:bundled:ios
        env:
          CAPACITOR_APP_ID: ${{ secrets.CAPACITOR_APP_ID }}
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
          NUXT_PUBLIC_STRIPE_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_KEY }}
          NUXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NUXT_PUBLIC_MAPBOX_TOKEN }}
          NUXT_PUBLIC_GOOGLE_API_KEY: ${{ secrets.NUXT_PUBLIC_GOOGLE_API_KEY }}
          NUXT_PUBLIC_OS_API_KEY: ${{ secrets.NUXT_PUBLIC_OS_API_KEY }}

      # Deployment team's diagnosis (2026-11-27, after run 45974060701
      # hung 37+ min mid SPM checkout and the http.lowSpeedTime config
      # alone didn't fix it): Xcode's own built-in git/SCM handling for
      # package resolution can hang in a CI sandbox. -scmProvider system
      # makes it shell out to the system's real git instead, and
      # resolving packages explicitly here (rather than letting gym
      # trigger it again inside the archive step) turns the hang into a
      # normal, fast step. Caching SourcePackages across runs then
      # avoids re-fetching the same dependency versions every time.
      - name: cache resolved Swift packages
        uses: actions/cache@v4
        with:
          path: ios/App/.spm-cache
          key: spm-${{ hashFiles('package-lock.json') }}
          restore-keys: spm-

      - name: pre-resolve Swift Package dependencies
        timeout-minutes: 10
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -scmProvider system \
            -clonedSourcePackagesDirPath ios/App/.spm-cache

      - name: decode App Store Connect API key
        run: echo "${{ secrets.ASC_KEY_CONTENT_BASE64 }}" | base64 --decode > AuthKey.p8

      - name: build + upload to TestFlight
        # Confirmed hang (2026-11-27, run 45974060701): xcodebuild's SPM
        # package checkout froze for 37+ minutes mid-transfer with no
        # error. timeout-minutes bounds it so a repeat shows up as a
        # fast, clear failure instead of silently burning an hour of
        # runner time.
        timeout-minutes: 20
        run: bundle exec fastlane ${{ github.event.inputs.lane || 'testflight' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_FILEPATH: ${{ github.workspace }}/AuthKey.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CAPACITOR_APP_ID: ${{ secrets.CAPACITOR_APP_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gym's internal "xcodebuild -showBuildSettings" call defaults
          # to a 3s timeout x 4 retries, which is nowhere near enough for
          # a project with Swift Package dependencies to evaluate its
          # build graph (confirmed, run 45992818970: "timed out after 4
          # retries with a base timeout of 3").
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 3

      - name: clean up API key
        if: always()
        run: rm -f AuthKey.p8
